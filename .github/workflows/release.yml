name: release

# One chained run: release-please -> build and push to ECR Public -> artifact
# registration -> release finalized with the image digest.
#
# Recovery / backfill: dispatch with existing_tag to publish an existing tag.
#
# Needs: repo secret AWS_ROLE_ARN_ECR_PUSH (the role ARN the "Public ECR" service
# returns), repo variable NP_ARTIFACT_NRN, org secret ARTIFACT_NP_API_KEY, and the
# ECR repository + publisher role that the
# "Public ECR" service registers.
#
# Package publishing applies voltmx-foundry-app/publish at the release tag with the pushed
# digest: the scope as a package visible to every organization. It reuses
# ARTIFACT_NP_API_KEY (the publisher organization key, also allowed to write
# specs, scope types and packages) and needs the organization secrets
# PACKAGE_STATE_AWS_ACCOUNT_ID, PACKAGE_TFSTATE_BUCKET and PACKAGE_TFSTATE_REGION;
# the shared workflow skips it until PACKAGE_TFSTATE_BUCKET is set. The state
# role is github-actions-<repository>-package-state in that account, by
# convention; AWS_ROLE_ARN_PACKAGE_STATE overrides it for a fork whose role is
# named otherwise, and is not set here. Account, bucket and region are secrets,
# not variables: this repository is public and so are its run logs, and GitHub
# masks only secrets.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      existing_tag:
        description: 'Publish + finalize an existing tag (recovery/backfill)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  id-token: write # OIDC auth against AWS for the ECR push and the package state

jobs:
  # A missing secret or variable would otherwise surface as an opaque error after the build.
  preflight:
    # The template repository itself must never publish; repos created from it are not templates.
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check the publish configuration
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN_ECR_PUSH }}
          NP_ARTIFACT_NRN: ${{ vars.NP_ARTIFACT_NRN }}
        run: |
          missing=0
          if ! [[ "$AWS_ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/.+ ]]; then
            echo "::error::secret AWS_ROLE_ARN_ECR_PUSH is missing or not a role ARN; set it to the ARN the Public ECR service returned (README, Publishing)"
            missing=1
          fi
          if [ -z "$NP_ARTIFACT_NRN" ]; then
            echo "::error::variable NP_ARTIFACT_NRN is missing; set it to the NRN of the organization that owns the artifacts (README, Publishing)"
            missing=1
          fi
          exit "$missing"

  release:
    needs: preflight
    uses: nullplatform/actions-nullplatform/.github/workflows/release-publish-oci.yml@v1
    with:
      image_name: agent-plugins/scopes/voltmx-foundry-app
      # latest always points at the last release; pull requests publish to beta/ instead.
      also_tag_latest: true
      existing_tag: ${{ inputs.existing_tag || '' }}
      # Publishes the scope as a global package from this release's specs and
      # image (voltmx-foundry-app/publish).
      package_stack_dir: voltmx-foundry-app/publish
      # The stack renders the spec and action templates with gomplate
      # (tofu-modules' scope_definition); publish-package installs only the
      # tools named here.
      package_tools: gomplate
    secrets:
      aws_role_arn: ${{ secrets.AWS_ROLE_ARN_ECR_PUSH }}
      artifact_np_api_key: ${{ secrets.ARTIFACT_NP_API_KEY }}
      package_np_api_key: ${{ secrets.ARTIFACT_NP_API_KEY }}
      package_state_aws_account_id: ${{ secrets.PACKAGE_STATE_AWS_ACCOUNT_ID }}
      package_state_role_arn: ${{ secrets.AWS_ROLE_ARN_PACKAGE_STATE }}
      package_state_bucket: ${{ secrets.PACKAGE_TFSTATE_BUCKET }}
      package_state_region: ${{ secrets.PACKAGE_TFSTATE_REGION }}
