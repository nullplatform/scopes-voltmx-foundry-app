# delete-deployment, also for failed deployments and for a deployment
# cancelled while in flight (with the initial strategy the platform dispatches
# delete-deployment, never rollback-deployment). Foundry keeps one active
# version per app and environment, so do_unpublish in deployment mode looks at
# what is active:
#   - another version: nothing to do, the deployment never took over;
#   - the version of this deployment, and the scope has a previous finalized
#     deployment (resolved by build_context as for a rollback): that version
#     is published again through do_rollback, so the deployment the platform
#     keeps as active is the one that serves;
#   - the version of this deployment and no other finalized deployment: the
#     app is unpublished.
# It fails open on lookups (publish status unreadable, deployments of the
# scope not listable, previous release unreadable): it warns and leaves the
# app as it is, so a deployment can always be deleted; only a Publish or an
# Unpublish that fails fails the step. build_context runs in rollback mode (no
# asset, no profile variables): a deployment whose build has no asset must
# still be deletable.
include:
  - "$SERVICE_PATH/values.yaml"
steps:
  - name: assume role
    type: script
    file: "$SERVICE_PATH/utils/assume_role_step"
    output:
      - name: AWS_ACCESS_KEY_ID
        type: environment
      - name: AWS_SECRET_ACCESS_KEY
        type: environment
      - name: AWS_SESSION_TOKEN
        type: environment
  - name: build context
    type: script
    file: "$SERVICE_PATH/deployment/scripts/build_context"
    configuration:
      BUILD_CONTEXT_MODE: rollback
    output:
      - name: CONTEXT
        type: environment
      - name: SCOPE_CONFIGURATION
        type: environment
      - name: FOUNDRY_APP
        type: environment
      - name: APP_VERSION
        type: environment
      - name: ENVIRONMENT_NAME
        type: environment
      - name: MFCLI_AUTH_ARGS
        type: environment
      - name: MFCLI_CMD
        type: environment
      - name: CREDENTIALS_SECRET
        type: environment
      - name: SECRETS_PREFIX
        type: environment
      - name: ASSETS_REGION
        type: environment
      - name: DEPLOYMENT_ID
        type: environment
      - name: SCOPE_ID
        type: environment
      - name: PREVIOUS_DEPLOYMENT_ID
        type: environment
      - name: PREVIOUS_RELEASE_SEMVER
        type: environment
      - name: PREVIOUS_DEPLOYMENT_LOOKUP
        type: environment
      - name: WORKDIR_BASE
        type: environment
      - name: WORKDIR
        type: environment
  - name: read credentials
    type: script
    file: "$SERVICE_PATH/deployment/scripts/read_credentials"
    output:
      - name: MFCLI_USER
        type: environment
      - name: MFCLI_PASSWORD
        type: environment
  - name: restore or unpublish
    type: script
    file: "$SERVICE_PATH/deployment/scripts/do_unpublish"
    configuration:
      UNPUBLISH_MODE: deployment
