# Operator configuration for every workflow (not shown to developers); each key under
# configuration becomes an environment variable in the steps.
provider_categories:
  - scope-configurations
  - cloud-providers
  - identity-access-control
configuration:
  MFCLI_CMD: "java -jar /opt/mfcli/mfcli.jar"   # the Foundry CLI (mfcli.jar is baked or mounted, never shipped); mfcli.command in the scope configuration or MFCLI_CMD in the worker env point tests at tools/mfcli-mock/mfcli
  PUBLISH_TIMEOUT_SECONDS: 900                  # give up waiting for publish-status after this
  PUBLISH_POLL_SECONDS: 15                      # how often publish-status is polled
  MFCLI_CALL_TIMEOUT_SECONDS: 300               # upper bound for a single mfcli call (a hung CLI is stopped)
  WORKDIR: /tmp/voltmx-foundry-app              # scratch directory (one subdirectory per deployment)
  ASSETS_PREFIX: foundry/                       # key prefix of the assets bucket the CI uploads the exported apps under (= assets_prefix of specs/requirements/aws)
